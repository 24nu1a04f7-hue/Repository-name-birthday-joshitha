<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Happy Birthday Joshitha 🎂</title><link rel="stylesheet" href="style.css"></head>
<body><div id="stars"></div><div class="moon"></div><div id="particles"></div><div id="fireworks"></div>

<section class="page"><div class="card">
<p class="eyebrow">A special birthday surprise</p>
<h1>Happy Birthday<br><span>Joshitha</span> 🎂</h1>
<p class="sub">Something special is waiting for you. Click below to begin.</p>
<a class="btn" href="surprise.html">🎁 Open Your Surprise</a>
</div></section>
<audio id="birthdayAudio" src="music/birthday-theme.wav" preload="auto" loop></audio>
<div class="music"><button id="musicBtn">♫</button><div><b>Birthday Music</b><small id="musicStatus">Starting...</small></div><input id="volume" type="range" min="0" max="1" step=".01" value=".45"></div>
<script>
const audio=document.getElementById("birthdayAudio");
const musicBtn=document.getElementById("musicBtn");
const musicStatus=document.getElementById("musicStatus");
const volume=document.getElementById("volume");
let playing=false;
audio.volume=Number(volume.value);

async function playMusic(){
  try{
    await audio.play();
    playing=true; musicBtn.textContent="❚❚"; musicStatus.textContent="Playing";
  }catch(e){
    playing=false; musicBtn.textContent="♫"; musicStatus.textContent="Tap ♫ to play";
  }
}
function pauseMusic(){audio.pause();playing=false;musicBtn.textContent="♫";musicStatus.textContent="Paused"}
musicBtn.addEventListener("click",()=>playing?pauseMusic():playMusic());
volume.addEventListener("input",()=>audio.volume=Number(volume.value));

// Try autoplay on every page. If Chrome blocks it, the visible music button
// immediately provides a user-gesture fallback.
window.addEventListener("load",()=>setTimeout(playMusic,250));
document.addEventListener("click",e=>{
  if(e.target.closest(".music")) return;
  if(!playing) playMusic();
},{once:true});

function effects(){
  const box=document.getElementById("particles");
  if(!box)return;
  const items=["🎈","❤️","💖","✨","🌹","🎉"];
  for(let i=0;i<18;i++){
    const s=document.createElement("span");s.className="float";s.textContent=items[Math.floor(Math.random()*items.length)];
    s.style.left=Math.random()*100+"vw";s.style.animationDuration=(6+Math.random()*8)+"s";s.style.animationDelay=Math.random()*3+"s";box.appendChild(s);
    setTimeout(()=>s.remove(),15000);
  }
}
function fireworks(n=4){
  const box=document.getElementById("fireworks"); if(!box)return;
  for(let j=0;j<n;j++)setTimeout(()=>{
    const cx=15+Math.random()*70,cy=10+Math.random()*50;
    for(let i=0;i<32;i++){const a=Math.PI*2*i/32,r=70+Math.random()*100,p=document.createElement("i");p.className="firework";p.style.left=cx+"vw";p.style.top=cy+"vh";p.style.setProperty("--x",Math.cos(a)*r+"px");p.style.setProperty("--y",Math.sin(a)*r+"px");box.appendChild(p);setTimeout(()=>p.remove(),1300)}
  },j*350);
}
effects(); setInterval(effects,5000);
</script></body></html>
